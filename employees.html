<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StrongFire – מאבטחים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* … same CSS as dashboard (compact) … */
    </style>
</head>
<body class="dark">
    <aside class="sidebar">…</aside>
    <div class="content-area">
        <h1 class="text-2xl font-bold mb-5">מאבטחים</h1>
        <input type="text" id="searchInput" placeholder="חיפוש…" class="topbar-btn mb-4">
        <button id="addBtn" class="topbar-btn mb-4"><i class="fas fa-plus"></i> הוסף</button>
        <div class="table-card">
            <table id="employeesTable"><thead><tr><th>#</th><th>שם</th><th>ת.ז.</th><th>תפקיד</th><th>קורס</th><th>סטטוס</th><th>פעולות</th></tr></thead><tbody></tbody></table>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzVsc6_vkDiXpMc2_v0A1exz5G_6p47CPkv1GHBfvORCJ5ZrwFlRYukNbK9PEiNl8V5/exec';

        function jsonp(url) { /* same as dashboard */ }

        async function getData(sheet) { return jsonp(API_URL + '?action=get&sheet=' + sheet); }

        function postForm(action, data) {
            var form = document.createElement('form');
            form.method = 'POST';
            form.action = API_URL;
            form.target = 'hiddenFrame';
            form.style.display = 'none';
            var actionInput = document.createElement('input'); actionInput.name = 'action'; actionInput.value = action;
            form.appendChild(actionInput);
            for (var key in data) {
                var input = document.createElement('input'); input.name = key; input.value = data[key];
                form.appendChild(input);
            }
            document.body.appendChild(form);
            form.submit();
            setTimeout(function() { document.body.removeChild(form); }, 100);
        }

        async function loadEmployees() {
            var employees = await getData('employees');
            var tbody = document.querySelector('#employeesTable tbody');
            tbody.innerHTML = employees.map(function(e) {
                return `<tr>
                    <td>${e.uid}</td><td>${e.name}</td><td>${e.national_id}</td><td>${e.level}</td><td>${e.course||''}</td>
                    <td>${e.status}</td>
                    <td>
                        <button onclick="editEmployee('${e.national_id}')"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteEmployee('${e.national_id}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
        }

        document.getElementById('addBtn').onclick = function() {
            var name = prompt('שם'); if (!name) return;
            var nationalId = prompt('ת.ז.'); if (!nationalId) return;
            postForm('add', { sheet: 'employees', name: name, national_id: nationalId, level: 'מאבטח', course: 'בסיס', status: 'פעיל' });
            setTimeout(loadEmployees, 500);
        };

        window.editEmployee = function(id) { alert('עריכת ' + id); };
        window.deleteEmployee = function(id) {
            if (confirm('למחוק?')) {
                postForm('delete', { sheet: 'employees', national_id: id });
                setTimeout(loadEmployees, 500);
            }
        };

        // Init
        loadEmployees();
    </script>
    <iframe name="hiddenFrame" style="display:none;"></iframe>
</body>
</html>
