<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StrongFire – לוח בקרה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-body: #F8FAFC; --text-primary: #0F172A;
            --bg-card: rgba(255,255,255,0.85); --card-shadow: 0 4px 16px rgba(0,0,0,0.04);
            --border-color: #E2E8F0; --border-card: rgba(226,232,240,0.6);
            --bg-sidebar: #FFFFFF; --text-sidebar: #475569; --bg-sidebar-hover: #F1F5F9;
            --bg-topbar-btn: #E2E8F0; --text-topbar-btn: #0F172A;
            --text-alerts: #DC2626; --bg-alerts: #FEF2F2; --border-alerts: #FECACA;
            --bg-skeleton: #E2E8F0;
            --table-header-bg: #F1F5F9; --table-header-text: #1E293B; --table-row-hover: #F1F5F9;
            --chart-card-bg: rgba(255,255,255,0.85); --chart-card-border: rgba(226,232,240,0.6);
            --grid-color: #E2E8F0; --ticks-color: #475569;
            --placeholder-color: rgba(15,23,42,0.6);
            --sidebar-logo-color: #0F172A; --sidebar-border: #E2E8F0;
        }
        body.dark {
            --bg-body: #0F172A; --text-primary: #F1F5F9;
            --bg-card: rgba(30,41,59,0.8); --card-shadow: 0 4px 16px rgba(0,0,0,0.3);
            --border-color: #334155; --border-card: rgba(51,65,85,0.5);
            --bg-sidebar: #0F172A; --text-sidebar: #CBD5E1; --bg-sidebar-hover: rgba(51,65,85,0.45);
            --bg-topbar-btn: #334155; --text-topbar-btn: #F1F5F9;
            --text-alerts: #FCA5A5; --bg-alerts: #2A0F0F; --border-alerts: #7F1D1D;
            --bg-skeleton: #334155;
            --table-header-bg: #1E293B; --table-header-text: #CBD5E1; --table-row-hover: #334155;
            --chart-card-bg: rgba(30,41,59,0.8); --chart-card-border: rgba(51,65,85,0.5);
            --grid-color: #334155; --ticks-color: #CBD5E1;
            --placeholder-color: rgba(241,245,249,0.6);
            --sidebar-logo-color: #F1F5F9; --sidebar-border: #1E293B;
        }
        * { box-sizing: border-box; margin:0; padding:0; }
        html,body { overflow-x: hidden; font-family: 'Segoe UI','Inter',system-ui,sans-serif; background: var(--bg-body); color: var(--text-primary); transition: background 0.3s, color 0.2s; }
        .sidebar { transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); position: fixed; right:0; top:0; bottom:0; width:220px; z-index:30; transform: translateX(0); background: var(--bg-sidebar); border-left:1px solid var(--sidebar-border); display:flex; flex-direction:column; }
        .sidebar.collapsed { transform: translateX(100%); }
        .sidebar-logo { display:flex; align-items:center; gap:0.75rem; padding:1.5rem 1.5rem 2.25rem 1.5rem; }
        .sidebar-logo i { font-size:1.8rem; color:#3B82F6; background:rgba(59,130,246,0.1); padding:0.6rem; border-radius:0.75rem; }
        .sidebar-logo span { font-size:1.3rem; font-weight:700; color:var(--sidebar-logo-color); }
        .sidebar-nav { flex:1; padding:0.5rem 0.75rem; display:flex; flex-direction:column; gap:0.35rem; }
        .menu-item { transition: all 0.2s ease; display:flex; align-items:center; gap:0.75rem; padding:0.7rem 1rem; border-radius:0.5rem; position:relative; color:var(--text-sidebar); cursor:pointer; font-size:0.95rem; font-weight:500; text-decoration:none; }
        .menu-item i { width:1.25rem; text-align:center; font-size:1.05rem; }
        .menu-item:hover { background:var(--bg-sidebar-hover); color:var(--text-primary); }
        .menu-item.active { background:rgba(59,130,246,0.12); color:#3B82F6; font-weight:600; }
        .menu-item.active::before { content:''; position:absolute; right:auto; left:0; top:50%; transform:translateY(-50%); width:4px; height:24px; background:#3B82F6; border-radius:0 4px 4px 0; }
        .sidebar-footer { padding:1rem 1rem 1.5rem 1rem; border-top:1px solid var(--sidebar-border); margin-top:auto; }
        .theme-toggle-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:0.5rem; padding:0.65rem 1rem; border-radius:0.5rem; background:var(--bg-topbar-btn); color:var(--text-topbar-btn); border:none; cursor:pointer; font-size:0.9rem; font-weight:500; transition:all 0.2s; }
        .theme-toggle-btn:hover { opacity:0.9; }
        .topbar-btn { transition:all 0.2s; background:var(--bg-topbar-btn); color:var(--text-topbar-btn); border-radius:9999px; padding:0.35rem 0.75rem; display:inline-flex; align-items:center; gap:0.25rem; border:none; cursor:pointer; font-size:0.85rem; }
        .topbar-btn:hover { opacity:0.85; }
        .content-area { transition:margin-right 0.3s; margin-right:220px; padding:24px; height:100vh; overflow-y:auto; }
        .sidebar.collapsed + .content-area { margin-right:0; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .kpi-card { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); min-height: 120px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; position: relative; border-radius: 18px; border: 1px solid var(--border-card); padding: 1.15rem; background: var(--bg-card); backdrop-filter: blur(10px); color: var(--text-primary); box-shadow: var(--card-shadow); overflow: hidden; }
        .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.06); }
        .kpi-card.positive { border-top: 3px solid #10B981; }
        .kpi-card.warning { border-top: 3px solid #EF4444; }
        .kpi-card.info { border-top: 3px solid #3B82F6; }
        .kpi-card.neutral { border-top: 3px solid #8B5CF6; }
        .kpi-icon { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; font-size: 1.05rem; margin-bottom: 0.75rem; }
        .kpi-icon.blue { background: rgba(59,130,246,0.15); color: #3B82F6; }
        .kpi-icon.green { background: rgba(16,185,129,0.15); color: #10B981; }
        .kpi-icon.red { background: rgba(239,68,68,0.15); color: #EF4444; }
        .kpi-icon.purple { background: rgba(139,92,246,0.15); color: #8B5CF6; }
        .kpi-icon.amber { background: rgba(245,158,11,0.15); color: #F59E0B; }
        .progress-bar { width: 100%; height: 6px; background: var(--border-color); border-radius: 9999px; margin-top: 10px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 9999px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); position: relative; }
        .progress-fill::after { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { left: -100%; } 100% { left: 100%; } }
        .chart-card, .table-card { background: var(--chart-card-bg); border: 1px solid var(--chart-card-border); border-radius: 1rem; padding: 1rem; box-shadow: var(--card-shadow); backdrop-filter: blur(10px); }
        .alerts-card { border-radius: 1rem; padding: 1rem 1.25rem; margin-bottom: 1.5rem; background: var(--bg-alerts); border: 1px solid var(--border-alerts); color: var(--text-alerts); }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 0.75rem; text-align: right; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; }
        th { background: var(--table-header-bg); color: var(--table-header-text); border-bottom: 1px solid var(--border-color); cursor: pointer; user-select: none; font-weight: 600; white-space: nowrap; }
        th.sortable i { margin-right: 6px; font-size: 0.75em; transition: color 0.2s; }
        th.sortable.active-sort i { color: #3B82F6; }
        tbody tr { transition: background 0.2s; cursor: pointer; }
        tbody tr:hover { background: var(--table-row-hover); }
        tbody td { border-bottom: 1px solid var(--border-color); }
        .skeleton { background: var(--bg-skeleton); border-radius: 18px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        @media (max-width:1024px) { .content-area { padding:16px; margin-right:0; } .sidebar { transform:translateX(100%); } .sidebar.collapsed { transform:translateX(0); } .kpi-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }
        @media (max-width:768px) { .charts-row { flex-direction: column !important; } }
    </style>
</head>
<body class="dark">
    <aside class="sidebar" role="navigation" aria-label="תפריט ראשי">
        <div class="sidebar-logo"><i class="fas fa-shield-haltered"></i><span>StrongFire</span></div>
        <nav class="sidebar-nav" role="menubar">
            <a href="dashboard.html" class="menu-item active" aria-current="page"><i class="fas fa-tachometer-alt"></i><span>לוח בקרה</span></a>
            <a href="employees.html" class="menu-item"><i class="fas fa-users"></i><span>מאבטחים</span></a>
            <a href="weapons.html" class="menu-item"><i class="fas fa-gun"></i><span>נשקים</span></a>
            <a href="checkout.html" class="menu-item"><i class="fas fa-arrow-right"></i><span>מסירה</span></a>
            <a href="checkin.html" class="menu-item"><i class="fas fa-arrow-left"></i><span>החזרה</span></a>
            <a href="alerts.html" class="menu-item"><i class="fas fa-bell"></i><span>התראות</span></a>
            <a href="reports.html" class="menu-item"><i class="fas fa-chart-line"></i><span>דוחות</span></a>
            <a href="settings.html" class="menu-item"><i class="fas fa-cog"></i><span>הגדרות</span></a>
        </nav>
        <div class="sidebar-footer">
            <button id="themeToggleSide" class="theme-toggle-btn"><i class="fas fa-sun"></i><span>מצב בהיר</span></button>
        </div>
    </aside>

    <div class="content-area">
        <div class="flex justify-between items-center mb-5">
            <div class="flex items-center gap-3">
                <button id="menuToggle" class="lg:hidden text-2xl topbar-btn w-10 h-10 rounded-full flex items-center justify-center" aria-label="פתח תפריט"><i class="fas fa-bars"></i></button>
                <h1 class="text-2xl font-bold" style="font-size: clamp(1.5rem, 2.5vw, 2rem);">לוח בקרה</h1>
            </div>
            <div class="flex items-center gap-2">
                <input type="text" id="globalSearch" placeholder="חיפוש גלובלי..." class="px-3 py-1.5 rounded-full border bg-transparent text-sm focus:outline-none focus:ring-1 focus:ring-blue-500" style="border-color: var(--border-color); color: var(--text-primary); max-width:320px; flex:1;" aria-label="חיפוש גלובלי">
                <button id="exportBtn" class="topbar-btn px-2.5 py-0.5 text-xs flex items-center gap-1" aria-label="ייצוא CSV"><i class="fas fa-download text-xs"></i> CSV</button>
                <button id="refreshBtn" class="topbar-btn w-7 h-7 rounded-full flex items-center justify-center text-xs" aria-label="רענן נתונים"><i class="fas fa-sync-alt"></i></button>
            </div>
        </div>

        <div id="dashboardTab">
            <div id="skeletonLoader" class="hidden">
                <div class="kpi-grid">
                    <div class="skeleton" style="height:120px;"></div><div class="skeleton" style="height:120px;"></div><div class="skeleton" style="height:120px;"></div>
                    <div class="skeleton" style="height:120px;"></div><div class="skeleton" style="height:120px;"></div><div class="skeleton" style="height:120px;"></div><div class="skeleton" style="height:120px;"></div>
                </div>
                <div class="skeleton" style="height:180px; margin-bottom:24px;"></div><div class="skeleton" style="height:100px; margin-bottom:24px;"></div>
                <div class="grid grid-cols-2 gap-4"><div class="skeleton" style="height:160px;"></div><div class="skeleton" style="height:160px;"></div></div>
            </div>
            <div id="dashboardContent">
                <div class="kpi-grid" id="kpiGrid"></div>
                <div class="charts-row flex flex-col lg:flex-row gap-6 mb-6">
                    <div class="chart-card flex-1"><h3 class="font-semibold mb-2 text-sm">מגמת יציאות נשקים</h3><canvas id="lineChart" height="180"></canvas></div>
                    <div class="chart-card lg:w-2/5" style="max-width:400px;"><h3 class="font-semibold mb-2 text-sm">מצב נשקים</h3><canvas id="donutChart" height="180"></canvas></div>
                </div>
                <div class="alerts-card" role="alert" aria-live="polite">
                    <div class="text-center font-semibold text-sm mb-1">התראות גבוהות</div>
                    <ul class="text-xs text-center list-none m-0 p-0" id="highAlertsList"><li>אין התראות גבוהות</li></ul>
                    <div class="text-center mt-1"><a href="alerts.html" class="text-xs text-blue-400 hover:underline">הצג את כל ההתראות</a></div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
                    <div class="table-card"><h3 class="font-semibold mb-2 text-sm">עובדים חסומים אחרונים</h3><div class="table-wrapper"><table id="blockedTable">...</table></div></div>
                    <div class="table-card"><h3 class="font-semibold mb-2 text-sm">נשקים באיחור</h3><div class="table-wrapper"><table id="overdueTable">...</table></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzVsc6_vkDiXpMc2_v0A1exz5G_6p47CPkv1GHBfvORCJ5ZrwFlRYukNbK9PEiNl8V5/exec';

        function jsonp(url) {
            return new Promise((resolve, reject) => {
                const callback = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
                const script = document.createElement('script');
                window[callback] = (data) => { delete window[callback]; script.remove(); resolve(data); };
                script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + callback;
                script.onerror = () => { delete window[callback]; script.remove(); reject('JSONP error'); };
                document.body.appendChild(script);
            });
        }

        const LS_PREFIX = 'strongfire_';
        let realData = { totalWeapons: 0, weaponsOut: 0, overdueWeapons: 0, totalEmployees: 0, blockedEmployees: 0, weaponsInSafe: 0, activeEmployees: 0, highAlerts: [], blockedList: [], overdueList: [] };
        let theme = localStorage.getItem(LS_PREFIX + 'theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        let chartsInitialized = false, chartLine, chartDonut, wsInterval = null;

        function isDark() { return document.body.classList.contains('dark'); }
        function formatDate(iso) { if (!iso) return '-'; let d = new Date(iso); if (isNaN(d.getTime())) return iso; return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }

        async function loadDashboardData(forceRefresh = false) {
            const CACHE_KEY = 'dashboard_cache', CACHE_TIME = 60000;
            if (!forceRefresh) {
                const cached = sessionStorage.getItem(CACHE_KEY);
                if (cached) {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_TIME) {
                        realData = data;
                        return;
                    }
                }
            }
            const allData = await jsonp(API_URL + '?action=dashboard');
            const employees = allData.employees || [];
            const weapons = allData.weapons || [];
            const checkouts = allData.checkouts || [];
            const alerts = allData.alerts || [];

            const totalWeapons = weapons.length;
            const weaponsOut = checkouts.filter(c => c.status === 'פעיל').length;
            const now = new Date();
            const overdueWeapons = checkouts.filter(c => c.status === 'פעיל' && new Date(c.checkout_date) < new Date(now - 7*86400000)).length;
            const totalEmployees = employees.length;
            const blockedEmployees = employees.filter(e => e.status === 'חסום').length;
            const weaponsInSafe = totalWeapons - weaponsOut;
            const activeEmployees = totalEmployees - blockedEmployees;
            const highAlerts = alerts.filter(a => a.severity === 'גבוה' && a.status === 'פתוח').map(a => `${a.date} - ${a.message}`);
            const blockedList = employees.filter(e => e.status === 'חסום').map(e => ({ name: e.name, id: e.national_id, level: e.level }));
            const overdueList = checkouts.filter(c => c.status === 'פעיל' && new Date(c.checkout_date) < new Date(now - 7*86400000)).map(c => ({ serial: c.weapon_serial, employee: employees.find(e => e.uid == c.employee_uid)?.name || '?', date: formatDate(c.checkout_date) }));

            realData = { totalWeapons, weaponsOut, overdueWeapons, totalEmployees, blockedEmployees, weaponsInSafe, activeEmployees, highAlerts, blockedList, overdueList };
            sessionStorage.setItem(CACHE_KEY, JSON.stringify({ data: realData, timestamp: Date.now() }));
        }

        const kpiCardsMeta = [
            { id: 'totalWeapons', title: 'סה"כ נשקים', valueKey: 'totalWeapons', borderClass: 'neutral', icon: 'fa-gun', iconColor: 'purple' },
            { id: 'weaponsInSafe', title: 'נשקים בכספת', valueKey: 'weaponsInSafe', borderClass: 'info', progress: true, progressColor: 'linear-gradient(90deg, #2563EB, #3B82F6)', icon: 'fa-shield-alt', iconColor: 'blue' },
            { id: 'weaponsOut', title: 'נשקים בחוץ', valueKey: 'weaponsOut', borderClass: '', icon: 'fa-arrow-right', iconColor: 'amber' },
            { id: 'overdueWeapons', title: 'נשקים באיחור', valueKey: 'overdueWeapons', borderClass: 'warning', icon: 'fa-clock', iconColor: 'red' },
            { id: 'totalEmployees', title: 'סה"כ עובדים', valueKey: 'totalEmployees', borderClass: 'neutral', icon: 'fa-users', iconColor: 'purple' },
            { id: 'activeEmployees', title: 'עובדים כשירים', valueKey: 'activeEmployees', borderClass: 'positive', progress: true, progressColor: 'linear-gradient(90deg, #059669, #10B981)', icon: 'fa-check-circle', iconColor: 'green' },
            { id: 'blockedEmployees', title: 'עובדים חסומים', valueKey: 'blockedEmployees', borderClass: 'warning', icon: 'fa-ban', iconColor: 'red' }
        ];

        function renderKPICards() {
            const container = document.getElementById('kpiGrid');
            let html = '';
            kpiCardsMeta.forEach(card => {
                let progressHtml = card.progress ? `<div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:0%; background:${card.progressColor};" id="progress-${card.id}"></div></div>` : '';
                html += `<div class="kpi-card ${card.borderClass}" data-id="${card.id}">
                    <div class="kpi-icon ${card.iconColor}"><i class="fas ${card.icon}"></i></div>
                    <div class="text-xs opacity-75" style="font-size:0.85rem;">${card.title}</div>
                    <div class="text-2xl font-bold mt-0.5 kpi-value" style="font-size:1.75rem;">--</div>${progressHtml}</div>`;
            });
            container.innerHTML = html;
            updateKpiValues();
        }
        function updateKpiValues() {
            document.querySelectorAll('.kpi-card').forEach(card => {
                let id = card.dataset.id, valEl = card.querySelector('.kpi-value');
                if (valEl && realData[id] !== undefined) valEl.innerText = realData[id];
                let pf = document.getElementById('progress-' + id);
                if (pf) {
                    let pct = 0;
                    if (id === 'weaponsInSafe') pct = Math.min(100, Math.round((realData.weaponsInSafe / Math.max(1,realData.totalWeapons)) * 100));
                    else if (id === 'activeEmployees') pct = Math.min(100, Math.round((realData.activeEmployees / Math.max(1,realData.totalEmployees)) * 100));
                    pf.style.width = pct + '%';
                }
            });
        }

        function renderAlerts() {
            const c = document.getElementById('highAlertsList');
            c.innerHTML = realData.highAlerts.length ? realData.highAlerts.map(a => `<li>${a}</li>`).join('') : '<li>אין התראות גבוהות</li>';
        }

        // טבלאות – מיון
        let blockedSort = { col: 'name', dir: 'asc' };
        let overdueSort = { col: 'serial', dir: 'asc' };

        function sortTableData(data, col, dir) {
            return [...data].sort((a,b) => {
                let valA = a[col]||'', valB = b[col]||'';
                if (col === 'id') { valA = parseInt(valA); valB = parseInt(valB); }
                if (col === 'date') { valA = new Date(valA); valB = new Date(valB); }
                return (valA < valB ? -1 : valA > valB ? 1 : 0) * (dir === 'asc' ? 1 : -1);
            });
        }

        function renderTables() {
            const blockedSorted = sortTableData(realData.blockedList, blockedSort.col, blockedSort.dir);
            const overdueSorted = sortTableData(realData.overdueList, overdueSort.col, overdueSort.dir);

            const blockedTable = document.getElementById('blockedTable');
            blockedTable.innerHTML = `
                <thead><tr>
                    <th class="sortable" data-sort="name" style="width:30%;"><i class="fas fa-sort${blockedSort.col==='name'?(blockedSort.dir==='asc'?'-up':'-down'):''}"></i> שם</th>
                    <th class="sortable" data-sort="id" style="width:30%;"><i class="fas fa-sort${blockedSort.col==='id'?(blockedSort.dir==='asc'?'-up':'-down'):''}"></i> ת.ז.</th>
                    <th class="sortable" data-sort="level" style="width:40%;"><i class="fas fa-sort${blockedSort.col==='level'?(blockedSort.dir==='asc'?'-up':'-down'):''}"></i> רמה</th>
                </tr></thead>
                <tbody>${blockedSorted.map(e => `<tr><td>${e.name}</td><td>${e.id}</td><td>${e.level}</td></tr>`).join('')}</tbody>`;

            const overdueTable = document.getElementById('overdueTable');
            overdueTable.innerHTML = `
                <thead><tr>
                    <th class="sortable" data-sort="serial" style="width:25%;"><i class="fas fa-sort${overdueSort.col==='serial'?(overdueSort.dir==='asc'?'-up':'-down'):''}"></i> סיריאלי</th>
                    <th class="sortable" data-sort="employee" style="width:25%;"><i class="fas fa-sort${overdueSort.col==='employee'?(overdueSort.dir==='asc'?'-up':'-down'):''}"></i> מאבטח</th>
                    <th class="sortable" data-sort="date" style="width:25%;"><i class="fas fa-sort${overdueSort.col==='date'?(overdueSort.dir==='asc'?'-up':'-down'):''}"></i> תאריך מסירה</th>
                    <th style="width:25%;">תאריך החזרה</th>
                </tr></thead>
                <tbody>${overdueSorted.map(w => `<tr><td>${w.serial}</td><td>${w.employee}</td><td>${w.date}</td><td>${w.checkin_date||'טרם'}</td></tr>`).join('')}</tbody>`;

            attachSortEvents();
            applyGlobalSearch();
        }

        function attachSortEvents() {
            document.querySelectorAll('#blockedTable th.sortable').forEach(th => {
                th.onclick = () => {
                    const col = th.dataset.sort;
                    blockedSort.dir = blockedSort.col === col ? (blockedSort.dir === 'asc' ? 'desc' : 'asc') : 'asc';
                    blockedSort.col = col;
                    renderTables();
                };
            });
            document.querySelectorAll('#overdueTable th.sortable').forEach(th => {
                th.onclick = () => {
                    const col = th.dataset.sort;
                    overdueSort.dir = overdueSort.col === col ? (overdueSort.dir === 'asc' ? 'desc' : 'asc') : 'asc';
                    overdueSort.col = col;
                    renderTables();
                };
            });
        }

        function applyGlobalSearch() {
            const term = (document.getElementById('globalSearch')?.value || '').toLowerCase();
            document.querySelectorAll('.kpi-card').forEach(card => {
                card.style.display = term ? (card.innerText.toLowerCase().includes(term) ? '' : 'none') : '';
            });
            document.querySelectorAll('#blockedTable tbody tr, #overdueTable tbody tr').forEach(row => {
                row.style.display = term ? (row.innerText.toLowerCase().includes(term) ? '' : 'none') : '';
            });
        }

        function initCharts() {
            const lCtx = document.getElementById('lineChart').getContext('2d');
            chartLine = new Chart(lCtx, {
                type: 'line',
                data: { labels: ['יום ב','יום ג','יום ד','יום ה','יום ו','שבת'], datasets: [{ label: 'יציאות', data: [30,45,38,52,70,85], borderColor: '#60A5FA', backgroundColor: 'rgba(96,165,250,0.1)', fill: true, tension: 0.2, pointRadius: 3 }] },
                options: { responsive: true, maintainAspectRatio: true, scales: { y: { grid: { color: getComputedStyle(document.body).getPropertyValue('--grid-color') }, ticks: { color: getComputedStyle(document.body).getPropertyValue('--ticks-color'), font: { size: 10 } } }, x: { grid: { color: getComputedStyle(document.body).getPropertyValue('--grid-color') }, ticks: { color: getComputedStyle(document.body).getPropertyValue('--ticks-color'), font: { size: 10 } } } } }
            });

            const dCtx = document.getElementById('donutChart').getContext('2d');
            const ctp = { id: 'centerText', afterDraw(chart) { let {ctx, chartArea: {top,bottom,left,right}} = chart; ctx.save(); ctx.font = 'bold 18px "Segoe UI"'; ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--text-primary'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(realData.totalWeapons, (left+right)/2, (top+bottom)/2); ctx.restore(); } };
            chartDonut = new Chart(dCtx, { type: 'doughnut', data: { labels: ['בכספת','בחוץ','בטיפול'], datasets: [{ data: [realData.weaponsInSafe, realData.weaponsOut, realData.overdueWeapons], backgroundColor: ['#3B82F6','#F59E0B','#EF4444'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 } } } } }, plugins: [ctp] });
            chartsInitialized = true;
        }
        function updateCharts() {
            if (!chartsInitialized) return;
            chartDonut.data.datasets[0].data = [realData.weaponsInSafe, realData.weaponsOut, realData.overdueWeapons];
            chartDonut.update();
        }
        function updateChartsTheme() {
            if (!chartsInitialized) return;
            let gc = getComputedStyle(document.body).getPropertyValue('--grid-color'), tc = getComputedStyle(document.body).getPropertyValue('--ticks-color');
            chartLine.options.scales.y.grid.color = gc; chartLine.options.scales.y.ticks.color = tc;
            chartLine.options.scales.x.grid.color = gc; chartLine.options.scales.x.ticks.color = tc;
            chartLine.update(); chartDonut.update();
        }

        function setTheme(t) {
            document.body.classList.toggle('dark', t === 'dark');
            localStorage.setItem(LS_PREFIX + 'theme', t);
            document.getElementById('themeToggleSide').innerHTML = t === 'dark' ? '<i class="fas fa-moon"></i><span>מצב כהה</span>' : '<i class="fas fa-sun"></i><span>מצב בהיר</span>';
            updateChartsTheme();
        }
        function toggleTheme() { setTheme(isDark() ? 'light' : 'dark'); }

        async function refreshData() {
            document.getElementById('skeletonLoader').classList.remove('hidden');
            document.getElementById('dashboardContent').classList.add('hidden');
            await loadDashboardData(true);
            renderKPICards(); updateKpiValues(); renderAlerts(); renderTables(); updateCharts();
            document.getElementById('skeletonLoader').classList.add('hidden');
            document.getElementById('dashboardContent').classList.remove('hidden');
        }

        function exportCSV() {
            let csvRows = [['עובדים חסומים'],['שם','ת.ז.','רמה']];
            realData.blockedList.forEach(e => csvRows.push([e.name, e.id, e.level]));
            csvRows.push([],['נשקים באיחור'],['מס סידורי','מאבטח','תאריך מסירה','תאריך החזרה']);
            realData.overdueList.forEach(w => csvRows.push([w.serial, w.employee, w.date, w.checkin_date||'']));
            let blob = new Blob(["\uFEFF" + csvRows.map(r => r.join(',')).join('\n')], { type: 'text/csv;charset=utf-8;' });
            let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'dashboard.csv'; a.click();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            setTheme(theme);
            renderKPICards(); renderAlerts(); initCharts();
            await refreshData();
            document.getElementById('themeToggleSide').addEventListener('click', toggleTheme);
            document.getElementById('menuToggle').addEventListener('click', () => document.querySelector('.sidebar').classList.toggle('collapsed'));
            document.getElementById('refreshBtn').addEventListener('click', refreshData);
            document.getElementById('exportBtn').addEventListener('click', exportCSV);
            document.getElementById('globalSearch').addEventListener('input', applyGlobalSearch);
            wsInterval = setInterval(() => refreshData(), 30000);
        });
    </script>
</body>
</html>
