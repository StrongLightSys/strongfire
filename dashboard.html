<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StrongFire – לוח בקרה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* … CSS זהה לחלוטין להודעה הקודמת … */
    </style>
</head>
<body class="dark">
    <!-- … HTML זהה … -->

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzVsc6_vkDiXpMc2_v0A1exz5G_6p47CPkv1GHBfvORCJ5ZrwFlRYukNbK9PEiNl8V5/exec';

        function jsonp(url) {
            return new Promise((resolve, reject) => {
                const callback = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
                const script = document.createElement('script');
                window[callback] = (data) => {
                    delete window[callback];
                    script.remove();
                    resolve(data);
                };
                script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + callback;
                script.onerror = () => { delete window[callback]; script.remove(); reject('JSONP error'); };
                document.body.appendChild(script);
            });
        }

        function formatDate(iso) { if(!iso) return '-'; const d = new Date(iso); return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`; }

        async function loadDashboard(forceRefresh = false) {
            const CACHE_KEY = 'dashboard_cache';
            const CACHE_TIME = 60000;

            if (!forceRefresh) {
                const cached = sessionStorage.getItem(CACHE_KEY);
                if (cached) {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_TIME) {
                        renderDashboard(data);
                        return;
                    }
                }
            }

            const allData = await jsonp(API_URL + '?action=dashboard');
            const data = {
                employees: allData.employees || [],
                weapons: allData.weapons || [],
                checkouts: allData.checkouts || [],
                alerts: allData.alerts || []
            };

            sessionStorage.setItem(CACHE_KEY, JSON.stringify({ data, timestamp: Date.now() }));
            renderDashboard(data);
        }

        function renderDashboard({ employees, weapons, checkouts, alerts }) {
            const totalWeapons = weapons.length;
            const weaponsOut = checkouts.filter(c => c.status === 'פעיל').length;
            const overdue = checkouts.filter(c => c.status === 'פעיל' && new Date(c.checkout_date) < new Date(Date.now() - 7*86400000)).length;
            const totalEmp = employees.length;
            const blocked = employees.filter(e => e.status === 'חסום').length;
            const safe = totalWeapons - weaponsOut;
            const activeEmp = totalEmp - blocked;

            document.getElementById('kpiGrid').innerHTML = [
                {title:'סה"כ נשקים', value:totalWeapons, icon:'fa-gun', color:'purple'},
                {title:'נשקים בכספת', value:safe, icon:'fa-shield-alt', color:'blue', pct:Math.round(safe/totalWeapons*100)},
                {title:'נשקים בחוץ', value:weaponsOut, icon:'fa-arrow-right', color:'amber'},
                {title:'נשקים באיחור', value:overdue, icon:'fa-clock', color:'red'},
                {title:'סה"כ עובדים', value:totalEmp, icon:'fa-users', color:'purple'},
                {title:'עובדים כשירים', value:activeEmp, icon:'fa-check-circle', color:'green', pct:Math.round(activeEmp/totalEmp*100)},
                {title:'עובדים חסומים', value:blocked, icon:'fa-ban', color:'red'}
            ].map(c => `<div class="kpi-card ${c.border||''}">
                <div class="kpi-icon ${c.color}"><i class="fas ${c.icon}"></i></div>
                <div class="text-xs opacity-75">${c.title}</div>
                <div class="text-2xl font-bold">${c.value}</div>
                ${c.pct ? `<div class="progress-bar"><div class="progress-fill" style="width:${c.pct}%"></div></div>` : ''}
            </div>`).join('');

            if (window.donut) window.donut.destroy();
            const ctx = document.getElementById('donutChart').getContext('2d');
            window.donut = new Chart(ctx, { type:'doughnut', data:{labels:['בכספת','בחוץ','בטיפול'], datasets:[{data:[safe, weaponsOut, overdue], backgroundColor:['#3B82F6','#F59E0B','#EF4444']}]} });

            document.getElementById('alertsCard').innerHTML = alerts.filter(a => a.severity==='גבוה' && a.status==='פתוח').map(a => `<p>${a.message}</p>`).join('') || 'אין התראות';
            document.getElementById('blockedTable').innerHTML = '<tr><th>שם</th><th>ת.ז.</th><th>תפקיד</th></tr>' + employees.filter(e => e.status==='חסום').map(e => `<tr><td>${e.name}</td><td>${e.national_id}</td><td>${e.level}</td></tr>`).join('');
            document.getElementById('overdueTable').innerHTML = '<tr><th>סיריאלי</th><th>מאבטח</th><th>תאריך</th></tr>' + checkouts.filter(c => c.status==='פעיל' && new Date(c.checkout_date) < new Date(Date.now()-7*86400000)).map(c => `<tr><td>${c.weapon_serial}</td><td>${employees.find(e => e.uid==c.employee_uid)?.name||'?'}</td><td>${formatDate(c.checkout_date)}</td></tr>`).join('');
        }

        document.getElementById('refreshBtn').addEventListener('click', () => loadDashboard(true));
        document.getElementById('themeToggleSide').addEventListener('click', () => {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('strongfire_theme', isDark ? 'dark' : 'light');
            document.getElementById('themeToggleSide').innerHTML = isDark ? '<i class="fas fa-moon"></i> מצב כהה' : '<i class="fas fa-sun"></i> מצב בהיר';
        });

        (function() {
            const theme = localStorage.getItem('strongfire_theme') || 'dark';
            document.body.classList.toggle('dark', theme === 'dark');
            document.getElementById('themeToggleSide').innerHTML = theme === 'dark' ? '<i class="fas fa-moon"></i> מצב כהה' : '<i class="fas fa-sun"></i> מצב בהיר';
            loadDashboard();
        })();
    </script>
</body>
</html>
