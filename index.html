<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzVsc6_vkDiXpMc2_v0A1exz5G_6p47CPkv1GHBfvORCJ5ZrwFlRYukNbK9PEiNl8V5/exec';

    // ... (jsonp, showToast, formatDate, Cache helpers – ללא שינוי) ...

    // ========== פונקציית POST חדשה (מחליפה את postForm) ==========
    function postAjax(action, data) {
        return new Promise((resolve) => {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', API_URL);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            const params = new URLSearchParams();
            params.append('action', action);
            params.append('sheet', data.sheet || 'employees');
            for (let key in data) {
                params.append(key, data[key]);
            }
            xhr.onload = () => {
                try {
                    const res = JSON.parse(xhr.responseText);
                    resolve(res && res.success);
                } catch(e) {
                    resolve(false);
                }
            };
            xhr.onerror = () => resolve(false);
            xhr.send(params);
        });
    }

    // ... (שאר הפונקציות) ...

    async function saveEmployee() {
        const name = document.getElementById('inputName').value.trim();
        const nationalId = document.getElementById('inputNationalId').value.trim();
        if (!name || !nationalId) return alert('שם ותעודת זהות נדרשים');
        const data = {
            name, national_id: nationalId,
            level: document.getElementById('inputLevel').value,
            course: document.getElementById('inputCourse').value,
            status: document.getElementById('inputStatus').value,
            license_expiry: document.getElementById('inputLicense').value,
            medical_expiry: document.getElementById('inputMedical').value,
            training_expiry: document.getElementById('inputTraining').value,
            weapons: assignedWeapons.join(', ')
        };

        let success = false;
        if (currentEditId) {
            data.national_id = currentEditId;
            success = await postAjax('update', { ...data, sheet: 'employees', national_id: currentEditId });
        } else {
            if (empData.employees.some(e => e.national_id == nationalId)) return alert('תעודת זהות קיימת');
            const maxUid = Math.max(...empData.employees.map(e => e.uid||0), 0);
            data.uid = maxUid + 1;
            success = await postAjax('add', { ...data, sheet: 'employees' });
        }

        if (success) {
            clearAllCaches();
            // רענון מיידי + רענון נוסף כעבור 1.5 שניות למקרה שהשרת מתעכב
            loadEmployees(true);
            setTimeout(() => loadEmployees(true), 1500);
            document.getElementById('employeeModal').classList.remove('active');
            showToast(currentEditId ? 'המאבטח עודכן' : 'המאבטח נוסף');
        } else {
            alert('השמירה נכשלה. אנא בדוק את החיבור.');
        }
    }

    window.deleteEmployee = async function(nationalId) {
        if (!confirm('למחוק?')) return;
        const success = await postAjax('delete', { sheet: 'employees', national_id: nationalId });
        if (success) {
            clearAllCaches();
            loadEmployees(true);
            setTimeout(() => loadEmployees(true), 1500);
            showToast('המאבטח נמחק');
        } else {
            alert('המחיקה נכשלה. אנא בדוק את החיבור.');
        }
    };

    // (עבור Weapons – יש לעדכן באותו אופן: postAjax במקום postForm)
</script>
