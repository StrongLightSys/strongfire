<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>StrongFire – עובדים</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0F172A; color: #F1F5F9; padding: 2rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.5rem; border: 1px solid #334155; text-align: right; }
        th { background: #1E293B; }
        td[data-editable] { cursor: pointer; background: rgba(59,130,246,0.1); }
        td[data-editable]:hover { background: rgba(59,130,246,0.2); }
        .toast { position:fixed; bottom:20px; left:20px; background:#10B981; color:white; padding:0.75rem 1.25rem; border-radius:0.5rem; z-index:200; }
    </style>
</head>
<body>
    <h1>StrongFire – עובדים</h1>
    <div id="content">טוען…</div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbx-MqUzAFZlFfbOGSzZYiR3DF4dd06xJ7N4fe7KQHS-v99VLJ0RcwbudPS95Ycsm1Tv/exec';

        function jsonp(url) {
            return new Promise((resolve, reject) => {
                const callback = 'cb_' + Date.now();
                const script = document.createElement('script');
                window[callback] = (data) => { delete window[callback]; script.remove(); resolve(data); };
                script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + callback;
                script.onerror = () => { delete window[callback]; script.remove(); reject(new Error('JSONP error')); };
                document.body.appendChild(script);
            });
        }

        function postForm(action, data) {
            // יצירת iframe נסתר
            const iframe = document.createElement('iframe');
            iframe.name = 'hiddenFrame_' + Date.now();
            iframe.style.display = 'none';
            document.body.appendChild(iframe);

            const form = document.createElement('form');
            form.method = 'POST';
            form.action = API_URL;
            form.target = iframe.name;
            form.style.display = 'none';

            form.innerHTML = `<input name="action" value="${action}"><input name="sheet" value="${data.sheet || 'employees'}">` +
                Object.entries(data).map(([k,v]) => `<input name="${k}" value="${v}">`).join('');

            document.body.appendChild(form);
            form.submit();

            // ניקוי אחרי שליחה
            setTimeout(() => {
                form.remove();
                iframe.remove();
            }, 500);
        }

        function showToast(msg) {
            const toast = document.createElement('div'); toast.className = 'toast'; toast.innerText = msg;
            document.body.appendChild(toast); setTimeout(() => toast.remove(), 2500);
        }

        async function loadEmployees() {
            try {
                const employees = await jsonp(API_URL + '?action=get&sheet=employees');
                if (!employees || employees.length === 0) {
                    document.getElementById('content').innerHTML = '<p>אין נתונים.</p>';
                    return;
                }
                const headers = Object.keys(employees[0]);
                let html = '<table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
                employees.forEach(row => {
                    html += '<tr>';
                    headers.forEach(h => {
                        const val = row[h] !== undefined ? row[h] : '';
                        const editable = (h === 'status' || h === 'level' || h === 'course') ? '1' : '0';
                        html += `<td data-editable="${editable}" data-col="${h}" data-key="${row['national_id']}" data-current="${val}">${val}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
                document.getElementById('content').innerHTML = html;
                document.querySelectorAll('td[data-editable="1"]').forEach(td => {
                    td.addEventListener('click', async () => {
                        const col = td.dataset.col, key = td.dataset.key, cur = td.dataset.current;
                        const val = prompt('ערוך ' + col, cur);
                        if (val !== null && val !== cur) {
                            postForm('update', { sheet: 'employees', national_id: key, [col]: val });
                            showToast('עודכן – מרענן…');
                            // רענון אוטומטי
                            setTimeout(loadEmployees, 2500);
                        }
                    });
                });
            } catch(e) {
                document.getElementById('content').innerHTML = '<p style="color:red;">שגיאה: ' + e.message + '</p>';
            }
        }

        loadEmployees();
    </script>
</body>
</html>
